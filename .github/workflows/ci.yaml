name: ci

# Fast offline checks on every push and pull request.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test updater
        run: make test
      - name: Validate bundle structure
        run: make validate
