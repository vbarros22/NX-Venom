name: "atmosphere"
display_name: "Atmosphere"
aliases:
  - "ams"
enabled: true
category: "Core"
source:
  type: "github-release"
  repo: "Atmosphere-NX/Atmosphere"
  # PINNED: hekate_ipl.ini boots with secmon=atmosphere/exosphere.bin, which
  # comes from Horizon OC and must match this Atmosphere version. HOC 2.6.0
  # ships an exosphere for 1.12.1; package3 1.12.2 + that exosphere boots to a
  # black screen. Bump only together with a HOC release built for the new AMS,
  # and update `requires` in horizon-oc.yaml (the updater enforces it).
  release: "1.12.1"
assets:
  - pattern: "atmosphere-*.zip"
    type: "zip"
  - pattern: "fusee.bin"
    type: "file"
install:
  mappings:
    - asset: "atmosphere-*.zip"
      from: "atmosphere/"
      to: "Sources/NXVenom/atmosphere/"
      mode: "overwrite"
      exclude:
        - "config/**"
        - "config_templates/**"
        - "hosts/**"
        - "kips/**"
    - asset: "atmosphere-*.zip"
      from: "hbmenu.nro"
      to: "Sources/NXVenom/hbmenu.nro"
      mode: "overwrite"
    - asset: "atmosphere-*.zip"
      from: "switch/daybreak.nro"
      to: "Sources/NXVenom/switch/daybreak/daybreak.nro"
      mode: "overwrite"
    - asset: "atmosphere-*.zip"
      from: "atmosphere/reboot_payload.bin"
      to: "Sources/NXVenom/switch/.packages/RAM Patch/Default/reboot_payload.bin"
      mode: "overwrite"
    - asset: "fusee.bin"
      from: "fusee.bin"
      to: "Sources/NXVenom/bootloader/payloads/fusee.bin"
      mode: "overwrite"
