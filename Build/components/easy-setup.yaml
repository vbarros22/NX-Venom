name: "easy-setup"
display_name: "Easy Setup"
enabled: true
category: "Packages"
source:
  type: "github-branch-archive"
  repo: "dominatorul/Easy-setup"
  branch: "main"
install:
  transforms:
    # Drop upstream's "Testing builds" installer (it downloads a zip and moves
    # it over the SD root). Matched by header, so URL changes don't break it.
    - type: "remove-ini-section"
      asset: "Easy-setup-main-*.zip"
      path: "data/miscellaneous.ini"
      section: "Testing builds*"
      final_newline: true
  mappings:
    - asset: "Easy-setup-main-*.zip"
      from: "."
      to: "Sources/NXVenom/switch/.packages/Easy Setup/"
      mode: "overwrite"
      exclude:
        - "README.md"
